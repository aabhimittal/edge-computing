sentence=Allocation-free edge primitives: streaming anomaly detection, adaptive sampling, and a delta+RLE frame codec.
paragraph=EdgeSuite bundles three composable building blocks for microcontrollers doing on-device intelligence. AnomalyDetector runs EWMA z-score outlier detection in O(1) memory. AdaptiveSampler tunes the sampling interval to signal activity to save power and bandwidth. EdgeCompressor packs int16 sample batches into compact CRC-protected frames whose wire format is decoded byte-for-byte by the companion Ruby gateway.
