sentence=Allocation-free edge primitives: streaming anomaly detection, adaptive sampling, bounded-error sample selection, a delta+RLE frame codec, and a resynchronising frame reader.
paragraph=EdgeSuite bundles five composable building blocks for microcontrollers doing on-device intelligence. AnomalyDetector runs EWMA z-score outlier detection in O(1) memory. AdaptiveSampler tunes the sampling interval to signal activity to save power and bandwidth. SwingingDoor drops readings a straight line already predicts, with a hard bound on reconstruction error, before the radio wakes. EdgeCompressor packs int16 sample batches into compact CRC-protected frames whose wire format is decoded byte-for-byte by the companion Ruby gateway. FrameStream reassembles those frames from a noisy byte stream, resynchronising past line noise, split reads and bit flips.
